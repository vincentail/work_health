name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ./build.sh

      - name: Package
        run: ditto -c -k --keepParent build/WorkHealth.app WorkHealth.zip

      - uses: actions/upload-artifact@v4
        with:
          name: WorkHealth
          path: WorkHealth.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" WorkHealth.zip --generate-notes
