name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # 标签 v1.2.0 → 1.2.0，否则 1.0.<构建序号>
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.0.{0}', github.run_number) }}
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          export VERSION="${VERSION#v}"
          ./build.sh dmg
          ditto -c -k --keepParent build/WorkHealth.app "build/WorkHealth-$VERSION.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: WorkHealth-macOS
          path: |
            build/*.dmg
            build/*.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: bash
        run: |
          VERSION="${VERSION#v}"
          dotnet build windows/WorkHealth.csproj -c Release -o build/win -p:Version="$VERSION"
          cd build/win && 7z a "../WorkHealth-Windows-$VERSION.zip" WorkHealth.exe WorkHealth.exe.config

      - uses: actions/upload-artifact@v4
        with:
          name: WorkHealth-Windows
          path: build/*.zip

  release:
    needs: [macos, windows]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${VERSION#v}"
          gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "WorkHealth $VERSION" --generate-notes
