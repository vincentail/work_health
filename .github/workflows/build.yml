name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"
          fi
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build
        run: |
          ./build.sh dmg
          ditto -c -k --keepParent build/WorkHealth.app "build/WorkHealth-$VERSION.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: WorkHealth-${{ env.VERSION }}
          path: |
            build/*.dmg
            build/*.zip

      - name: Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" build/*.dmg build/*.zip \
            --target "$GITHUB_SHA" --title "WorkHealth $VERSION" --generate-notes
